variables:
  # GitLab can only cache paths inside the project directory.
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

default:
  image: rust:latest
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
  cache:
    key: ${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

check:
  script:
    - just check

build:
  script:
    - just build

embedded:
  script:
    - rustup target add thumbv7em-none-eabihf
    - just embedded

test:
  script:
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
    - just test

msrv:
  image: rust:1.88
  script:
    - cargo check --release

check-fmt:
  cache: []
  script:
    - rustup component add rustfmt
    - just check-fmt

clippy:
  script:
    - rustup component add clippy
    - just clippy

docs:
  script:
    # The justfile uses `cargo +nightly`. This command fails if CARGO_HOME is not the directory
    # rustup was installed to.
    - CARGO_HOME=/usr/local/cargo rustup toolchain install nightly --profile minimal
    - just docs
